name: Scrape CMTEB outage table

on:
  schedule:
    # Every 6 hours at :07 past: off the top of the hour, when GitHub's
    # scheduled jobs queue up and start late. Cron is UTC:
    # 02:07 / 08:07 / 14:07 / 20:07 UTC = 05:07 / 11:07 / 17:07 / 23:07 Bucharest (summer).
    - cron: "7 2,8,14,20 * * *"
  workflow_dispatch:      # manual run from the Actions tab

permissions:
  contents: write         # the job commits scraper_data/ back to the repo

concurrency:
  group: scrape           # two runs must never push at the same time
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # The scraper is stdlib only, so there is no install step.
      - name: Scrape and parse
        run: python -m scraper.run

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper_data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "scrape $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase origin main
            git push
          fi
