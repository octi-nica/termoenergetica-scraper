name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["scraper_data/**"]   # the scrape bot's commits don't need a test run
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Run tests (offline; network test is skipped)
        run: uv run pytest -q
